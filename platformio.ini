[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
upload_speed = 115200
monitor_filters = log2file

; Garante um esquema de particao com suporte a OTA (o projeto usa Update.h)
board_build.partitions = default.csv

; ==============================================================================
; Cada teste isolado vira um environment proprio, compilando so o seu .cpp -
; assim os varios arquivos de teste podem conviver em src/ sem dar erro de
; setup()/loop() duplicados. Pra compilar/gravar um teste especifico:
;   pio run -e teste_resistencias -t upload
;   pio run -e teste_sensores -t upload
;   pio run -e teste_ventoinhas -t upload
;   pio run -e teste_wifi_servidor -t upload
;   pio run -e teste_modbus -t upload
; ==============================================================================

[env:teste_resistencias]
build_src_filter = +<*> -<teste_sensores.cpp> -<teste_ventoinhas.cpp> -<teste_wifi_servidor.cpp> -<teste_modbus.cpp>

[env:teste_sensores]
build_src_filter = +<*> -<Secador_Novo2026.cpp> -<teste_ventoinhas.cpp> -<teste_wifi_servidor.cpp> -<teste_modbus.cpp>

[env:teste_ventoinhas]
build_src_filter = +<*> -<Secador_Novo2026.cpp> -<teste_sensores.cpp> -<teste_wifi_servidor.cpp> -<teste_modbus.cpp>

[env:teste_wifi_servidor]
build_src_filter = +<*> -<Secador_Novo2026.cpp> -<teste_sensores.cpp> -<teste_ventoinhas.cpp> -<teste_modbus.cpp>

[env:teste_modbus]
build_src_filter = +<*> -<Secador_Novo2026.cpp> -<teste_sensores.cpp> -<teste_ventoinhas.cpp> -<teste_wifi_servidor.cpp>
lib_deps = emelianov/modbus-esp8266

